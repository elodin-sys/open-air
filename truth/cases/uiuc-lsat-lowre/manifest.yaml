acceptance:
  max_abs_z: 2.0
  max_mean_abs_z: 1.5
  min_fraction_within_2sigma: 0.68
  provisional: false
stages: [aero]
notes:
  - Lift slope and zero-lift angle use a least-squares fit over -4 to +4 degrees on the increasing-alpha branch.
  - The Volume 2 files do not provide measured pitching moment; their repeated representative Cm is intentionally not scored.
  - Failed drag or zero-lift residuals characterize missing transition and laminar-bubble physics.
  - This dataset was visible while the low-Re domain threshold and residual regressions were authored; it is a consumed calibration/domain-characterization case, not an independent holdout.
