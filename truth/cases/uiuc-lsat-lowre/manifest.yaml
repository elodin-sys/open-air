id: uiuc-lsat-lowre
title: UIUC LSAT NACA 2415 low-Reynolds-number section anchor
truth_class: B
role: calibration
status: active
intended_uses:
  - Calibrate and characterize four-digit section-model behavior at tail and tip Reynolds numbers.
  - Verify that laminar-separation-bubble conditions are explicitly flagged as extrapolative.
runner: naca4-section-model
source:
  organization: University of Illinois at Urbana-Champaign
  dataset: UIUC Low-Speed Airfoil Tests Volume 2, NACA 2415 clean
  revision: "NACA2415.LFT/DRG created 1997-09-12"
  license: GPL-2.0-only
  reference_url: https://m-selig.ae.illinois.edu/pd.html
  redistribution: Original polar files remain fetchable from UIUC under GPL-2.0; this case commits only derived scalar experimental facts with attribution.
