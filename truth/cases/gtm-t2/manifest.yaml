observables:
  - id: cl_alpha_per_deg
    units: 1/deg
    description: Baseline zero-sideslip whole-aircraft lift slope over 0 to 6 degrees
  - id: neutral_point_mac
    units: MAC
    description: Neutral-point station aft of wing MAC leading edge
  - id: cm_alpha_sign_correct
    units: boolean
    description: Delivered aircraft has statically stable negative pitching-moment slope
  - id: trim_alpha_deg
    units: deg
    description: Baseline no-control pitching-moment zero crossing
  - id: cruise_lod
    units: "1"
    description: Baseline lift-to-drag ratio at the pitching-moment zero crossing
  - id: stall_speed_mps
    units: m/s
    description: Clean one-g stall speed scaled to initial operating weight
  - id: mtow_kg
    units: kg
    description: Initial flight gross mass
  - id: span_m
    units: m
    description: Reference wing span
  - id: wing_area_m2
    units: m^2
    description: Reference wing planform area
  - id: mac_m
    units: m
    description: Reference mean aerodynamic chord
  - id: fuselage_length_m
    units: m
    description: Published overall aircraft length
  - id: geometry_requirement_ok
    units: boolean
    description: Every requirement-treatment geometry prior remains inside its hard bound
acceptance:
  max_abs_z: 2.0
  max_mean_abs_z: 1.5
  min_fraction_within_2sigma: 0.85
  provisional: false
stages: [sizing, geometry, aero, mdo, reporting]
notes:
  - "Margins were frozen before the initial blind pipeline run: 10% CL-alpha, 4% MAC neutral point, sign-correct Cm-alpha, 1.5 degree trim, 15% L/D, and 10% stall and mass."
  - "The initial run was blind and failed. Subsequent implementation work was informed by its residuals, so the final pass is post-hoc verification and this case is no longer an untouched validation holdout."
  - "The declared 0.82 horizontal-tail lift-effectiveness factor comes from separate class-B NASA 14x22 tail-damage/static-margin evidence (NASA 20100002211, Fig. 5) combined with same-run VSPAERO wing/body evidence; it is calibration, not a predicted validation observable."
  - "The released coefficient tables are sampled polynomial approximations derived from a restricted wind-tunnel database, not raw measurements with experimental uncertainty; the complete case is therefore class C."
  - "The 960-second AirSTARsim timer is a design-time operational/countdown input, not measured endurance, and is intentionally not scored."
  - "The equivalent-engine, NACA4-section, and Reynolds-number abstractions are represented in u_input; the exposed GTM case is post-hoc verification, not validation."
  - "Hybrid constants are hash-bound to the same-phase VSP3. The delivered component-model versus full-VSPAERO neutral-point spread is 0.197 MAC (lifting-surface OAS versus full VSPAERO: 0.097 MAC); both are disclosed diagnostics, not passing independent stability checks."
  - "Stretch solvers are calibration-only and do not affect this case's verdict."
