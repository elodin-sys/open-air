id: gtm-t2
title: NASA AirSTAR GTM T-2 post-hoc system-model verification
truth_class: C
role: verification
status: active
intended_uses:
  - Verify post-hoc attached-flow lift slope and longitudinal-stability predictions against NASA's released GTM polynomial simulation database.
  - Test trim, drag, stall, mass, and geometry closure from design-time inputs only.
  - Exercise a design-input-only approximately 2 m span twin-turbine reproduction without claiming an untouched holdout, raw wind-tunnel, or flight validation.
runner: gtm-capstone-results
source:
  organization: NASA Langley Research Center
  dataset: GTM_DesignSim T-2 configuration and sampled polynomial aerodynamic simulation database v0.2
  revision: 9717143270144aca1f5d38d7c24c0fce678d1589
