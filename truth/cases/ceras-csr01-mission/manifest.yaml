stages: [mission]
notes:
  - "This is class-C engineered-reference evidence; a pass is verification and plausibility evidence, not independent physical validation."
  - "The sparse engine-deck overlay and low-order mission model were authored with the published mission results available; this case is therefore post-hoc verification, not an untouched holdout."
  - "Only the two full-power CeRAS conditions are sourced; part-throttle deck points are declared engineering interpolants covered by u_input."
  - "A follow-on full-aircraft pipeline is a truth-conditioned reconstruction: its 42,092 kg operating-empty mass and 18,402 kg fuel are derived from the published mission rows. Geometry and aero diagnostics execute, but the small-aircraft OAS wingbox stage refuses this transport-scale domain; this is not a source-only aircraft prediction."
  - "The full-aircraft hybrid constants are hash-bound to the same-phase VSP3. Component-model versus full-VSPAERO neutral-point spread is 0.095 MAC, while lifting-surface OAS versus full VSPAERO differs by 0.220 MAC; these are disclosed diagnostics, not mission scorecard observables or independent physical validation."
  - "Official report and CPACS downloads returned HTTP 401; public HTML tables remained accessible and supplied the committed rows."
