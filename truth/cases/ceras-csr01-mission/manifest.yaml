id: ceras-csr01-mission
title: CeRAS CSR-01 block mission and sparse engine-deck cross-check
truth_class: C
role: verification
status: active
intended_uses:
  - Verify block fuel and time for transport-aircraft range missions with a sparse typed engine deck.
  - Check requirement calls at the 500 NM study, 2750 NM design, and 2500 NM maximum-takeoff mission points.
  - Exercise the truth-conditioned CSR-01 full-aircraft pipeline as a separate class-C diagnostic with explicit transport-structures refusal.
runner: ceras-csr01-mission
