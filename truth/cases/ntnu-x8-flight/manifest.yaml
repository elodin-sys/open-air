observables:
  - id: pitch_rate_peak_gain_doublet
    units: 1/s
    description: Median peak pitch-rate response per collective-elevon amplitude
  - id: pitch_rate_rms_gain_doublet
    units: 1/s
    description: Median RMS pitch-rate response per collective-elevon RMS, doublets
  - id: pitch_rate_peak_gain_3211
    units: 1/s
    description: Peak pitch-rate response per collective-elevon amplitude, 3-2-1-1
  - id: pitch_rate_rms_gain_3211
    units: 1/s
    description: RMS pitch-rate response per collective-elevon RMS, 3-2-1-1
  - id: roll_rate_peak_gain_doublet
    units: 1/s
    description: Median peak roll-rate response per differential-elevon amplitude
  - id: roll_rate_rms_gain_doublet
    units: 1/s
    description: Median RMS roll-rate response per differential-elevon RMS, doublets
  - id: roll_rate_peak_gain_121
    units: 1/s
    description: Peak roll-rate response per differential-elevon amplitude, 1-2-1
  - id: roll_rate_rms_gain_121
    units: 1/s
    description: RMS roll-rate response per differential-elevon RMS, 1-2-1
  - id: trim_alpha_rad
    units: rad
    description: Median pre-excitation estimated angle of attack
  - id: trim_normal_force_cl
    units: "1"
    description: Median pre-excitation normal-force lift coefficient
acceptance:
  max_abs_z: 2.0
  max_mean_abs_z: 1.25
  min_fraction_within_2sigma: 1.0
  provisional: false
stages: [geometry, aero, flightdyn, structures, validation, report]
notes:
  - The four publisher-designated validation maneuvers are checksum-pinned outside the repository and may be opened only by an authorized scorer attempt.
  - The 13 training maneuvers are a separate calibration-role registry entry even though both manifests share this source directory.
  - Recorded controls and indicated airspeed force both measured and simulated estimators; temporary scorer replays are destroyed.
  - Strong three-dimensional wind, unknown molded airfoil, low Reynolds number, and diagonalized Ixz are frozen u_input allowances.
  - Published identified aerodynamic coefficients and modal poles were not copied into the model; public availability remains a disclosed blindness limitation.
