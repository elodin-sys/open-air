  - {id: roll_rate_rms_gain_doublet, units: 1/s, description: RMS roll-rate response gain for lateral doublets}
  - {id: roll_rate_peak_gain_121, units: 1/s, description: Peak roll-rate response gain for 1-2-1 inputs}
  - {id: roll_rate_rms_gain_121, units: 1/s, description: RMS roll-rate response gain for 1-2-1 inputs}
  - {id: trim_alpha_rad, units: rad, description: Pre-excitation estimated angle of attack}
  - {id: trim_normal_force_cl, units: "1", description: Pre-excitation normal-force lift coefficient}
acceptance:
  max_abs_z: 2.0
  max_mean_abs_z: 1.25
  min_fraction_within_2sigma: 1.0
  provisional: true
stages: [flightdyn]
notes:
  - This role, not the validation manifest, owns every committed training-file hash.
  - Its residuals informed the four-factor low-Re calibration and frozen uncertainty budget.
  - Passing this case is calibration evidence only and cannot establish a Class-A validation claim.
