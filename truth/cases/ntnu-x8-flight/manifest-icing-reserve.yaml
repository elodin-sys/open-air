    units: rad
    description: Median pre-excitation estimated angle of attack
  - id: trim_normal_force_cl
    units: "1"
    description: Median pre-excitation normal-force lift coefficient
acceptance:
  max_abs_z: 2.0
  max_mean_abs_z: 1.25
  min_fraction_within_2sigma: 1.0
  provisional: false
stages: [geometry, aero, flightdyn, structures, validation, report]
notes:
  - This case is deliberately deferred and must not be opened unless the primary holdout fails.
  - Four excitation-balanced maneuvers were selected without reading file contents from the campaign's 53-file clean subset.
  - Its attempt must be separately authorized and access-logged; no result from the primary holdout may alter its bands.
