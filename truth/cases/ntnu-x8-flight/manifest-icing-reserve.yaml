observables:
  - id: pitch_rate_peak_gain_doublet
    units: 1/s
    description: Peak pitch-rate response per collective-elevon amplitude
  - id: pitch_rate_rms_gain_doublet
    units: 1/s
    description: RMS pitch-rate response per collective-elevon RMS
  - id: pitch_rate_peak_gain_3211
    units: 1/s
    description: Peak pitch-rate response per collective-elevon amplitude, 3-2-1-1
  - id: pitch_rate_rms_gain_3211
    units: 1/s
    description: RMS pitch-rate response per collective-elevon RMS, 3-2-1-1
  - id: roll_rate_peak_gain_doublet
    units: 1/s
    description: Peak roll-rate response per differential-elevon amplitude
  - id: roll_rate_rms_gain_doublet
    units: 1/s
    description: RMS roll-rate response per differential-elevon RMS
  - id: roll_rate_peak_gain_121
    units: 1/s
    description: Peak roll-rate response per differential-elevon amplitude, 1-2-1
  - id: roll_rate_rms_gain_121
    units: 1/s
    description: RMS roll-rate response per differential-elevon RMS, 1-2-1
