name: Publish design reviews

on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "site/**"
      - "designs/*/design.yaml"
      - "src/openair/site/**"
      - "src/openair/theme.py"
      - "src/openair/reporting/presentation.py"
      - "tests/test_site.py"
      - "tests/test_presentation.py"
      - ".github/workflows/deploy-site.yml"
  pull_request:
    paths:
      - "results/**"
      - "site/**"
      - "designs/*/design.yaml"
      - "src/openair/site/**"
      - "src/openair/theme.py"
      - "src/openair/reporting/presentation.py"
      - "tests/test_site.py"
      - "tests/test_presentation.py"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install site test dependencies
        run: python -m pip install PyYAML pytest

      - name: Test site publishing contract
        env:
          PYTHONPATH: src
        run: pytest tests/test_site.py -q

      - name: Build site
        env:
          PYTHONPATH: src
        run: python -m openair.site build --out _site --commit "$GITHUB_SHA"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
