    kind: inspiration

  - slug: gtm-t2
    title: NASA GTM T-2
    summary: >-
      Source-locked reconstruction of NASA's 5.5-percent AirSTAR Generic
      Transport Model with equivalent twin-engine propulsion.
    kind: reproduction

  - slug: ntnu-x8
    title: NTNU Skywalker X8
    summary: >-
      Source-only flying-wing reconstruction with recorded flight-dynamics
