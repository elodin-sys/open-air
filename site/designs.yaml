    kind: reproduction

  - slug: diana2
    title: Baudismodel Diana 2
    summary: >-
      One-third-scale sailplane reconstruction with flexible-response
      evidence and an explicit record of its validation boundary.
    kind: reproduction

  - slug: ceras-csr01
    title: CeRAS CSR-01
    summary: >-
      Full-scale transport reconstruction publishing geometry, aerodynamics,
      and propulsion while preserving the recorded wingbox-closure allowance.
    kind: reproduction

  - slug: openair-x8-capstone
    title: Open-air X8 Capstone
    summary: >-
      Sealed 2026-08-22 NTNU X8 holdout artifact retained as a frozen report;
