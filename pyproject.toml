[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openair"
version = "0.1.0"
description = "Agent-friendly open aerostructures design suite (OpenVSP + OpenAeroStruct + OpenMDAO)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "matplotlib",
    "openmdao>=3.35",
    "openaerostruct>=2.12",
    "gmsh",
    "meshio",
    "pydantic>=2",
    "pyyaml",
    "pandas",
    "pillow>=10",
    "markdown-it-py>=3",
    "trimesh>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
openair = "openair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openair.designer" = [
    "assets/*.css",
    "assets/*.html",
    "assets/*.js",
    "assets/vendor/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --durations=20 -m 'not stretch'"
markers = [
    "slow: heavier OAS/MDO runs (seconds, not milliseconds)",
    "stretch: requires SU2_CFD binary or the micromamba tacs env; run with -m stretch",
    "truth: committed external-truth corpus and scorecard checks",
]
filterwarnings = [
    "ignore:.*np.core.*:DeprecationWarning",
    "ignore:.*divide by zero.*:RuntimeWarning",
]
