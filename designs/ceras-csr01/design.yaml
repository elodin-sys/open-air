name: ceras-csr01
notes: >-
  Post-hoc, truth-conditioned CeRAS CSR-01 reconstruction from public geometry,
  propulsion, payload, and mission inputs. The 42,092 kg operating-empty mass
  and 18,402 kg fuel load are algebraically derived from the same published
  mission rows used by the verification case; they are frozen inputs, not
  independent predictions. The equivalent trapezoid preserves published
  wing span, area, and MAC. The sparse two-engine deck contains only the two
  CeRAS rated conditions plus declared part-throttle engineering interpolants.
  The NACA 2412 sections, equivalent-tail details, 14 m operating-empty CG,
  payload/fuel-box locations, CLmax/stall screen, structural gauges, and
  nacelle frontal-CD allowance are declared conceptual assumptions. The
  small-aircraft OAS wingbox method explicitly refuses structural closure at
  this transport scale.

