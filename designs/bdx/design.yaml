name: "bdx"
notes: >-
  Provisional parametric reconstruction of the standard Elite Aerosports EA BDX sport turbine jet for a future Elodin example. Hard manufacturer facts: span 2.65 m, length 2.80 m, listed weight 18.14-19.05 kg (state unknown), recommended thrust 180-210 N, 6.0 L main fuel cell. Planform, loft, and fin shape are traced from an orthographic BDXL livery sheet and photo cross-checks; the BDXL is the stretched family variant, so shape ratios carry wider tolerances. Airfoil is NOT published; NACA 0012 is an explicitly labeled surrogate. Aerodynamic coefficients, mass distribution, and turbine data remain provisional until correlated with an actual BDX.
  
