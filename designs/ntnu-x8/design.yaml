# Fresh design-input-only reconstruction authored for the blind Class-A capstone.
name: ntnu-x8
notes: >-
  NTNU May-2023 Skywalker X8 reproduction translated from the source-cited
  design-time input pack without validation maneuvers or published aerodynamic
  coefficients. The equivalent trapezoid, NACA 0012 section, washout, molded
  body, fin attachment, packaging, structure, and drag are declared conceptual
  abstractions. The motor/controller package is modeled inside the aft body;
  the external pusher disk is represented by the published thrust deck. The
  measured 3.364 kg flight mass includes propulsion and battery. Liquid fuel,
  battery energy, range, and endurance are not claimed. Fuselage fineness,
  bay dimensions, component packaging, fin attachment, structural properties,
  mission screens, and solver settings are engineering assumptions checked by
  the canonical internal gates, not source or validation claims.

