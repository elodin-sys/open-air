name: fms-avanti
notes: >-
  FMS 90 mm Avanti 18th Anniversary EDF sport-jet model grounded in FMS
  dimensions and orthographic catalog views. The flown configuration overrides
  the published mass with 7.72 lb (3.501733 kg) and places the CG 2.75 ft
  (0.8382 m) aft of the nose. Published wing area fixes the trapezoid area;
  planform ratios, fuselage loft, and tail geometry remain image-derived.

