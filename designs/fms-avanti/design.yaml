    E_pa: 3.5e10
    nu: 0.30
    yield_pa: 2.5e8
    density_kg_m3: 1600.0
  spanwise: null
  modal_calibration: []
  sensor_stations: []

drag:
  interference_fraction: 0.08
  protuberance_cd0: 0.004

mass:
  fuel_mass_kg: 0.0
  fuel_mass_mode: fixed
  fuel_capacity_kg: null
  listed_mass_min_kg: 3.20
  listed_mass_max_kg: 3.501733
  listed_mass_state: >-
    FMS publishes approximately 3.20 kg; an FMS review measured 7 lb 10 oz
    ready to fly; the owner measured the flown Aleph configuration at 7.72 lb
  operating_empty_mass_kg: 3.501733
  operating_empty_cg_x_m: 0.8382
  systems_kg: 0.0
  landing_gear_fraction: 0.0
  avionics_kg: 0.0
  contingency_fraction: 0.0

flight_dynamics:
  enabled: false
  reference_airspeed_mps: 30.0
  reference_altitude_m: 100.0
  inertia: null
  control_surfaces:
    - id: aileron
      host: wing
      span_start_fraction: 0.58
      span_end_fraction: 0.94
      chord_fraction: 0.20
      max_up_deg: 24.0
      max_down_deg: 24.0
      source: >-
        span and chord fraction traced from FMS top view; angle inferred from
        the manual's 16 mm high-rate throw and local control chord
      mixing:
        - id: aileron
          mode: differential
          axis: roll
          gain: 1.0
    - id: flap
      host: wing
      span_start_fraction: 0.16
      span_end_fraction: 0.58
      chord_fraction: 0.22
      max_up_deg: 5.0
      max_down_deg: 50.0
      source: >-
        span and chord fraction traced from FMS top view; deflection inferred
        from the manual's 50 mm flap throw
      mixing:
        - id: flap
          mode: collective
          axis: lift
          gain: 1.0
    - id: elevator
      host: htail
      span_start_fraction: 0.08
      span_end_fraction: 0.96
      chord_fraction: 0.30
      max_up_deg: 20.0
      max_down_deg: 20.0
      source: >-
        hinge abstraction from FMS top view; angle inferred from the manual's
        14 mm high-rate throw and local control chord
      mixing:
        - id: elevator
          mode: collective
          axis: pitch
          gain: 1.0
    - id: rudder
      host: vtail
      span_start_fraction: 0.12
      span_end_fraction: 0.95
      chord_fraction: 0.30
      max_up_deg: 17.0
      max_down_deg: 17.0
      source: >-
        hinge abstraction from FMS side view; angle inferred from the manual's
        22 mm high-rate throw and local control chord
      mixing:
        - id: rudder
          mode: single
          axis: yaw
          gain: 1.0
  aeroelastic:
    enabled: false
    strip_count: 48
    modes_per_family: 1
    frequency_min_hz: 0.5
    frequency_max_hz: 30.0
    frequency_points: 160
    maximum_reduced_frequency: 0.3
    elastic_axis_fraction_chord: 0.4
    lift_curve_slope_per_rad: null
    calibration_id: none
  allow_diagonal_inertia_approximation: false
  calibration_id: none

solver:
  oas_with_viscous: true
  oas_with_wave: false
  optimize_maxiter: 35
  optimize_tol: 1.0e-5
  fd_step: 1.0e-3
  vspaero_wake_iters: 8
  vspaero_convergence_factor: 0.01
  su2_maxiter: 200
  gmsh_lc_m: 0.04
  stability_method: lifting_surface
  np_shift_mac: 0.04305
  wing_body_np_mac: null
  wing_body_cl_alpha_per_deg: null
  cm_washout_per_deg: 0.00362
  tail_incidence_offset_deg: 0.0
  tail_lift_effectiveness_factor: 1.0
  tail_lift_effectiveness_source: null
