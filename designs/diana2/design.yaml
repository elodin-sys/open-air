  hard_scale: 1.0
  fidelity_weight: 1.0
  span_over_length: 2.145922746781116
  span_over_length_tol: 0.01
  root_over_length: 0.09585121602288985
  root_over_length_tol: 0.005
  le_sweep_deg: 0.198595
  le_sweep_tol_deg: 0.5
  taper: 0.8447761194029852
  taper_tol: 0.01
  x_le_root_over_length: 0.2811158798283262
  x_le_root_over_length_tol: 0.015021459227467812
  payload_bay_x_lo_m: 0.45
  payload_bay_x_hi_m: 0.55
  fuel_tank_x_lo_m: 0.70
