    - eta: 0.2
      ei_bend_n_m2: 3600.0
      gj_n_m2: 410.0
      mass_per_span_kg_m: 0.95
      polar_mass_moment_per_span_kg_m: 0.0035
      section_modulus_m3: 4.0e-6
    - eta: 0.4
      ei_bend_n_m2: 2650.0
      gj_n_m2: 320.0
      mass_per_span_kg_m: 0.82
      polar_mass_moment_per_span_kg_m: 0.0029
      section_modulus_m3: 3.4e-6
    - eta: 0.6
      ei_bend_n_m2: 1780.0
      gj_n_m2: 220.0
      mass_per_span_kg_m: 0.68
      polar_mass_moment_per_span_kg_m: 0.0023
      section_modulus_m3: 2.8e-6
    - eta: 0.8
      ei_bend_n_m2: 985.0
      gj_n_m2: 120.0
      mass_per_span_kg_m: 0.52
      polar_mass_moment_per_span_kg_m: 0.0017
      section_modulus_m3: 2.1e-6
    - eta: 1.0
      ei_bend_n_m2: 303.0
      gj_n_m2: 35.0
      mass_per_span_kg_m: 0.35
      polar_mass_moment_per_span_kg_m: 0.0010
      section_modulus_m3: 1.2e-6
  modal_calibration:
    - id: first_symmetric_wing_bending
      family: bending
      order: 1
      frequency_hz: 7.42
      damping_fraction: 0.0288
      source: diana2-design-input-v1 visible ground mode 1
  sensor_stations:
    - id: I
      eta: 0.1638
      source: Diana2_sensor_locations.xlsx
    - id: M
      eta: 0.3452
      source: Diana2_sensor_locations.xlsx
    - id: O
      eta: 0.6612
      source: Diana2_sensor_locations.xlsx

drag:
  interference_fraction: 0.08
  protuberance_cd0: 0.004

mass:
  fuel_mass_kg: 0.0
  fuel_mass_mode: fixed
  operating_empty_mass_kg: 10.7
  operating_empty_cg_x_m: 0.74
  systems_kg: 0.0
  landing_gear_fraction: 0.0
  avionics_kg: 0.0
  contingency_fraction: 0.0

flight_dynamics:
  enabled: true
  reference_airspeed_mps: 22.5
  reference_altitude_m: 175.0
  inertia:
    ixx_kg_m2: 4.445
    iyy_kg_m2: 1.642
    izz_kg_m2: 6.897
    ixy_kg_m2: 0.0
    ixz_kg_m2: 0.332
    iyz_kg_m2: 0.0
    source: diana2-design-input-v1 published pendulum and rotational testing
  control_surfaces:
    - id: outer_aileron
      host: wing
      span_start_fraction: 0.62
      span_end_fraction: 0.97
      chord_fraction: 0.22
      max_up_deg: 20.0
      max_down_deg: 12.0
      source: diana2-design-input-v1 public control inventory and image abstraction
      mixing:
        - id: aileron
          mode: differential
          axis: roll
          gain: 1.0
    - id: middle_aileron
      host: wing
      span_start_fraction: 0.34
      span_end_fraction: 0.62
      chord_fraction: 0.22
      max_up_deg: 14.0
      max_down_deg: 10.0
      source: diana2-design-input-v1 public control inventory and image abstraction
      mixing:
        - id: aileron
          mode: differential
          axis: roll
          gain: 0.70
    - id: flap
      host: wing
      span_start_fraction: 0.10
      span_end_fraction: 0.34
      chord_fraction: 0.22
      max_up_deg: 8.0
      max_down_deg: 20.0
      source: diana2-design-input-v1 public control inventory and image abstraction
      mixing:
        - id: flap
          mode: collective
          axis: lift
          gain: 1.0
    - id: elevator
      host: htail
      span_start_fraction: 0.08
      span_end_fraction: 0.96
      chord_fraction: 0.30
      max_up_deg: 20.0
      max_down_deg: 20.0
      source: diana2-design-input-v1 public control inventory and image abstraction
      mixing:
        - id: elevator
          mode: collective
          axis: pitch
          gain: 1.0
    - id: rudder
      host: vtail
      span_start_fraction: 0.12
      span_end_fraction: 0.95
      chord_fraction: 0.32
      max_up_deg: 25.0
      max_down_deg: 25.0
      source: diana2-design-input-v1 public control inventory and image abstraction
      mixing:
        - id: rudder
          mode: single
          axis: yaw
          gain: 1.0
  aeroelastic:
    enabled: true
    strip_count: 64
    modes_per_family: 1
    frequency_min_hz: 0.5
    frequency_max_hz: 30.0
    frequency_points: 1000
    maximum_reduced_frequency: 0.30
    elastic_axis_fraction_chord: 0.40
    calibration_id: diana2-training-aeroelastic-v1
  allow_diagonal_inertia_approximation: true
  calibration_id: none

solver:
  oas_with_viscous: true
  oas_with_wave: true
  optimize_maxiter: 35
  optimize_tol: 1.0e-5
  fd_step: 1.0e-3
  vspaero_wake_iters: 5
  su2_maxiter: 200
  gmsh_lc_m: 0.08
  stability_method: lifting_surface
  np_shift_mac: 0.0
  cm_washout_per_deg: 0.00362
  tail_incidence_offset_deg: 0.0
  tail_lift_effectiveness_factor: 1.0
