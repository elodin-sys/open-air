name: diana2
notes: >-
  Source-locked reconstruction of the as-flown 1:3 Baudismodel Diana 2 from
  diana2-design-input-v1 only. Public geometry and measured mass properties
  are frozen in reproduction mode. The proprietary wing section is represented
  by NACA 0012, detailed body lofting and electric-installation dimensions are
  unscored geometry assumptions, and the visible L1 spanwise overlay carries
  aircraft-specific structural calibration without a first-principles claim.
  The declared quasi-isotropic CFRP equivalent is used only for internal OAS
  static-stress feasibility and is not an as-built laminate or certification claim.
  The broad conventional-tail static-margin band is a source-reproduction
  representability screen only; rigid-body handling quality is not claimed.

