  installation_count: 1
  x_m: 0.680
  lateral_offset_m: 0.0
  # Thrust axis: centre of the scanned tail cap (station x/L 1.0), root-chord datum.
  z_m: 0.024
  # Wide-bound placeholder: momentum-theory bound at the 20 A pack limit,
  # NOT a measured static thrust. Excluded from validation claims.
  max_thrust_sl_n: 10.0
  fuel_flow_max_kg_s: 0.0
  thrust_lapse_k_mach: 0.0
  thrust_lapse_floor: 1.0
  tsfc_part_a: 1.0
  tsfc_part_b: 0.0
  tsfc_mach_k: 0.0
  min_throttle: 0.30
  fuel_density_kg_m3: 800.0
  nacelle_frontal_cd: 0.08

wing:
  span_m: 0.849
  root_chord_m: 0.2601
  taper: 0.438
  le_sweep_deg: -6.38
  dihedral_deg: -0.9
  twist_root_deg: 1.6
  twist_tip_deg: 0.5
  t_over_c: 0.100
  airfoil: "1210"
  x_le_root_m: 0.4071
  z_root_m: 0.0245

fuselage:
  length_m: 0.712
  max_width_m: 0.150
  max_height_m: 0.107
  nose_fine_ratio: 0.22
  tail_fine_ratio: 0.28
  payload_bay_length_m: 0.105
  payload_bay_width_m: 0.050
  payload_bay_height_m: 0.050
  payload_bay_x_m: 0.190
  fuel_tank_x_m: 0.30
  # Stations: measured core sections with fitted split super-ellipse powers
