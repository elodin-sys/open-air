# AtomRC Dolphin V1.1 source-locked reproduction from a 3D scan. SI units.
# Datum (open-air frame, guidebook chapter 13): x=0 at the scanned nose tip,
# positive aft; y=0 on the fitted symmetry plane, +y right; z=0 at the nose-tip
# centre, +z up; the x axis is parallel to the wing ROOT chord line (the
# measurement-form leveling reference), which sat 1.91 deg nose-up in the
# scan's own frame. Geometry values are measured from reference/reference.json
# unless brief.md says otherwise.
name: atomrc-dolphin-v1-1
notes: >-
  Reproduction of the stock 845 mm AtomRC Dolphin V1.1 measured from a 3D scan
  of the airframe (reference/reference.json, sha256 701272c3...; 1.70 M faces,
  0.83 mm effective resolution) plus the installed-component brief. The
  measured 11-section wing loft preserves the forward-swept outer panel,
  root blend/deck extension, rounded tip, and tip droop; its gross projected
  area is 0.1668 m^2 and the scalar taper/sweep/dihedral are exact
  area/MAC-locus-equivalent descriptors. Airfoil camber is the NACA
  four-digit fit of six scanned sections; section-local loft t/c is inferred
  from their measured mean to preserve absolute thickness through root/deck
  chord extensions. Twist is measured on the root-chord datum after rotating the
  scanned +3.0 deg trailing-edge-up elevon position back to neutral. Body
  stations are measured core sections except the two shoulder stations noted
  in brief.md, where the plan-view width of the canopy-plus-shoulder blend is
  used because the single body loft cannot represent a T-shaped section. Fins
  are twin outward-canted plates measured at 39.0 deg cant, rooted at the
  measured deck/strake junction y +/-0.062 m and z +0.0496 m. Propulsion
  (2307 motor +
  ESC) is an internal aft package; the pusher disk is not lofted. Mass
  0.889 kg and CG 0.419 m are the owner's bench measurements (2026-09-09,
  flight configuration, single readings); they replace the 1.30 kg / 0.40 m
  v3-brief estimate. Elevon hinge (80.5% chord) and span (eta 0.37-0.97) are
  measured from the scan; the +/-30 deg travel is the owner's measurement
  (2026-09-09). Pitch trim is closed by the elevons with the measured twist
  frozen (mission.pitch_trim_control: elevon); the serialized
  trim_deflection_deg is the solver's cruise trim, not a measurement, and the
  flown trimmed neutral was not measured (the scan caught the elevons at
  +3.0 deg trailing-edge up with unknown transmitter trims).

