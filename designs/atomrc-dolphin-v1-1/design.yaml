# AtomRC Dolphin V1.1 source-locked reproduction. SI units throughout.
# Datum: x=0 at the nose tip, x=0.710 m at the rear propeller-hub plane
# (published overall length). z=0 at the nose-tip center, +z up.
name: atomrc-dolphin-v1-1
notes: >-
  Reproduction of the stock 845 mm AtomRC Dolphin V1.1 from the supplied top
  and side product renders plus published span/length/area and the
  installed-component brief. Forward-swept trapezoid wing uses the published
  0.1524 m^2 area as an equivalent-trapezoid tip-chord closure over the
  rounded tips; airfoil, twist, t/c, structural gauges/material, thrust,
  min-throttle, and cl_max are wide-bound placeholders, not measurements.
  Propulsion (2307 motor + ESC) is modeled as an internal aft package; the
  external pusher disk is not lofted. The schema payload bay is the forward
  battery bay; the aft avionics bay holding the 0.500 kg Elodin Aleph is
  bookkept inside the 1.30 kg operating-empty override at CG x=0.40 m and is
  documented in brief.md. Aft skid strakes and the wing-root shoulder blend
  are visible but unrepresentable; fins attach at the builder-derived body
  point below the rendered deck edge. Mass 1.30 kg and CG 0.40 m are
  provisional (+/-0.10 kg, +/-0.04 m) pending a weigh-and-balance.

