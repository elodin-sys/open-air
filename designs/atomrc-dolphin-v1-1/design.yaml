  stations:
    - x_over_length: 0.0
      width_m: 0.0
      height_m: 0.0
      z_offset_m: 0.0
      side_power: 2.0
      top_power: 2.0
      bottom_power: 2.0
    - x_over_length: 0.0983
      width_m: 0.089
      height_m: 0.065
      z_offset_m: 0.015
      side_power: 2.75
      top_power: 1.03
      bottom_power: 2.86
    - x_over_length: 0.316
      width_m: 0.118
      height_m: 0.107
      z_offset_m: 0.0316
      side_power: 3.0
      top_power: 0.89
      bottom_power: 1.17
    - x_over_length: 0.47
      width_m: 0.150
      height_m: 0.100
      z_offset_m: 0.033
      side_power: 2.0
      top_power: 2.0
      bottom_power: 2.0
    - x_over_length: 0.6531
      width_m: 0.141
      height_m: 0.082
      z_offset_m: 0.0248
      side_power: 1.92
      top_power: 2.61
      bottom_power: 0.64
    - x_over_length: 0.7621
