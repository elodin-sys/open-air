vtail:
  count: 2
  root_attachment: measured
  span_m: 0.119
  root_chord_m: 0.107
  taper: 0.559
  le_sweep_deg: 29.4
  cant_deg: 39.0
  t_over_c: 0.129
  x_le_m: 0.5426
  # Measured root junction at the deck/strake edge. Use it exactly; the
  # buried root extension continues into the measured shoulder/body union;
  # exported-mesh attachment QA verifies the serialized STL (brief sections 5/7).
  y_root_m: 0.062
  z_root_m: 0.0496

htail:
  span_m: 0.0
  root_chord_m: 0.10
  taper: 0.50
  le_sweep_deg: 0.0
  t_over_c: 0.10
  x_le_m: 0.60
  z_m: 0.02
  incidence_deg: 0.0

mission:
  endurance_s: 1.0
  endurance_required: false
  payload_kg: 0.0
  cruise_altitude_m: 100.0
  dash_altitude_m: 100.0
  cruise_mach: 0.0530
  # CL = 8.7181 N / (196.55 Pa x 0.1668 m^2) at the inferred 18 m/s reference speed.
  cruise_cl: 0.2660
  dash_mach_cap: 0.11
  limit_positive_g: 4.0
  limit_negative_g: -2.0
  safety_factor: 1.5
  static_margin_min: 0.03
  static_margin_max: 0.10
  reserve_fuel_fraction: 0.0
  cl_max: 1.0
  cl_max_basis: aircraft
  stall_speed_max_mps: 12.0
  # Tailless with measured (frozen) twist: the elevons close cruise pitch trim.
  pitch_trim_control: elevon

flight_dynamics:
  enabled: false
  reference_airspeed_mps: 18.0
  reference_altitude_m: 100.0
  control_surfaces:
    - id: elevon
      host: wing
      # Hinge line resolved at 80.5 % chord (spread 0.065 c) between the
      # first and last scan stations with a hinge step (reference.json
      # .measurements.control_surface: eta 0.370-0.970, 72 of 142 stations).
      span_start_fraction: 0.37
      span_end_fraction: 0.97
      chord_fraction: 0.195
      # Owner measurement 2026-09-09: full travel +30 deg (trailing edge up)
      # and -30 deg (trailing edge down) at the servo end points.
      max_up_deg: 30.0
      max_down_deg: 30.0
      # Flown trimmed neutral not measured; the scan caught the surfaces at
      # +3.0 deg trailing-edge up with unknown transmitter trims.
      neutral_deg: null
      # Analysis deflection (TE up positive). Starts at the as-scanned
      # position; the reproduction closure replaces it with the OAS cruise
      # trim solution in results/<concept>/optimized/design.yaml.
      trim_deflection_deg: 3.0
      source: >-
        hinge/span/chord from reference/reference.json (3D scan, 2026-09-05);
        travel +/-30 deg measured by the owner 2026-09-09
      mixing:
        - id: elevator
          mode: collective
          axis: pitch
          gain: 1.0
        - id: aileron
          mode: differential
          axis: roll
          gain: 1.0

structures:
  fem_model_type: wingbox
  spar_thickness_m: 0.0012
  skin_thickness_m: 0.0008
  tube_radius_m: 0.006
  tube_thickness_m: 0.0012
  wing_weight_ratio: 1.20
  # 15 spanwise nodes (8 per half-span) so the elevon edges at eta 0.37/0.97
  # are resolved; elevon trim moved <0.5 deg between 15 and 31 nodes.
  n_spanwise: 15
  n_chordwise: 3
  material:
    name: Assumed quasi-isotropic CFRP-equivalent for carbon-reinforced EPP
    E_pa: 3.5e10
    nu: 0.30
    yield_pa: 2.5e8
    density_kg_m3: 1600.0

mass:
  fuel_mass_kg: 0.0
  fuel_mass_mode: fixed
  # Bench-measured flight configuration (owner, 2026-09-09): 889 g total,
  # balance point 419 mm aft of the nose tip.
  operating_empty_mass_kg: 0.889
  operating_empty_cg_x_m: 0.419
  systems_kg: 0.0
  landing_gear_fraction: 0.0
  avionics_kg: 0.0
  contingency_fraction: 0.0

solver:
  oas_with_viscous: true
  oas_with_wave: false
  optimize_maxiter: 25
  optimize_tol: 1.0e-4
  fd_step: 1.0e-3
  vspaero_wake_iters: 8
  su2_maxiter: 200
  gmsh_lc_m: 0.05
  np_shift_mac: 0.04305
  cm_washout_per_deg: 0.00362
