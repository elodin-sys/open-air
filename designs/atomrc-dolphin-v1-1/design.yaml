  root_over_length: 0.3653
  root_over_length_tol: 0.0149
  le_sweep_deg: -6.38
  le_sweep_tol_deg: 2.0
  taper: 0.438
  taper_tol: 0.0615
  x_le_root_over_length: 0.5718
  x_le_root_over_length_tol: 0.0139
  payload_bay_x_lo_m: 0.165
  payload_bay_x_hi_m: 0.215
  fin_span_m: 0.119
  fin_span_tol_m: 0.004
  fin_root_chord_m: 0.107
  fin_root_chord_tol_m: 0.004
  fin_le_sweep_deg: 29.4
  fin_le_sweep_tol_deg: 1.0
  fin_cant_deg: 39.0
  fin_cant_tol_deg: 1.0
  fin_x_le_m: 0.5426
  fin_x_le_tol_m: 0.004

