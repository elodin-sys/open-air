name: gtm-t2
notes: >-
  Post-hoc reproduction of the NASA AirSTAR Generic Transport Model T-2.
  Geometry, mass targets, equivalent twin-engine totals, mission, and
  requirement envelopes come from the GTM T-2 input pack. The
  single centerline fin and conventional horizontal tail are source-locked.
  NACA 2412 is the documented conceptual section surrogate, not a calibration.
  Tail lift effectiveness is explicitly calibrated from separate class-B NASA
  tail-damage evidence; no polynomial score target is embedded here.

