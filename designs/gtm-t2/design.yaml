  treatment: reproduction
  span_over_length: 0.805741176
  span_over_length_tol: 0.010
  root_over_length: 0.145163813
  root_over_length_tol: 0.008
  le_sweep_deg: 25.0
  le_sweep_tol_deg: 2.0
  taper: 0.396781509
  taper_tol: 0.03
